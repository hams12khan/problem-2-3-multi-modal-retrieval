[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-pxt"
version = "1.0.0"
description = "Declarative Multimodal Video RAG for Automated Industrial Safety Forensics & OSHA Triage with Pixeltable"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pixeltable>=0.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pillow>=9.0.0",
    "numpy>=1.22.0"
]

[project.optional-dependencies]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "openai-whisper>=20231117"
]
test = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
